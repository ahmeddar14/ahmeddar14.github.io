<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متعة التعلم — تعلم الحروف العربية</title>
<meta name="description" content="متعة التعلم: موقع تفاعلي لتعليم الأطفال الحروف الأبجدية العربية والحروف مع الفتحة بالصوت والصورة.">
<meta name="theme-color" content="#14183c">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="stage" id="stage">

  <!-- ======================= ACCUEIL ======================= -->
  <section class="screen is-active" id="screen-home">
    <img class="bg" src="assets/alphabet/home.jpg" alt="متعة التعلم — تعلم، ألعب، واكتشف">

    <button class="hs" data-go="home" style="left:1.40%;top:2.08%;width:20.09%;height:13.18%" aria-label="متعة التعلم"></button>
    <button class="hs" data-go="grid" style="left:71.20%;top:1.66%;width:7.29%;height:12.48%" aria-label="اشترك"></button>
    <button class="hs" data-go="grid" style="left:79.63%;top:1.66%;width:7.29%;height:12.48%" aria-label="المحتوى"></button>
    <button class="hs" data-go="home" style="left:88.04%;top:1.66%;width:7.48%;height:12.48%" aria-label="الرئيسية"></button>

    <button class="hs pill" data-go="grid"  style="left:10.37%;top:62.69%;width:33.00%;height:11.23%" aria-label="اكتشف معانا — الحروف الأبجدية"></button>
    <button class="hs pill" data-go="fgrid" style="left:10.47%;top:75.99%;width:32.90%;height:11.65%" aria-label="انضم إلينا — الحروف مع الفتحة"></button>
  </section>

  <!-- ======================= GRILLE — ALPHABET ======================= -->
  <section class="screen" id="screen-grid">
    <img class="bg" src="assets/alphabet/grid.jpg" alt="اكتشف معانا — حروف الأبجدية العربية">

    <button class="hs" data-go="home" style="left:0.93%;top:1.42%;width:20.45%;height:13.48%" aria-label="متعة التعلم"></button>
    <button class="hs" data-go="fgrid" style="left:74.53%;top:1.56%;width:7.43%;height:12.06%" aria-label="اشترك"></button>
    <button class="hs" data-go="grid" style="left:82.81%;top:1.56%;width:7.06%;height:12.06%" aria-label="المحتوى"></button>
    <button class="hs" data-go="home" style="left:90.89%;top:1.56%;width:6.69%;height:12.06%" aria-label="الرئيسية"></button>

    <div class="tiles" id="tiles-grid"></div>

    <button class="hs pill" id="btn-playall" style="left:43.68%;top:78.72%;width:27.42%;height:10.64%" aria-label="استمع للحرف"></button>
    <button class="hs pill" data-go="home" style="left:1.67%;top:64.96%;width:17.38%;height:10.92%" aria-label="رجوع"></button>
  </section>

  <!-- ======================= LETTRE — ALPHABET ======================= -->
  <section class="screen" id="screen-letter">
    <img class="bg" id="letter-bg" src="assets/alphabet/alef.jpg" alt="">

    <div class="glyph-wrap" id="glyph-wrap" hidden>
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <text id="glyph-text" x="50" y="53" text-anchor="middle" dominant-baseline="central"
              font-size="62" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round"
              paint-order="stroke" fill="#24b13d">ص</text>
      </svg>
    </div>

    <button class="hs" data-go="home" style="left:1.40%;top:3.50%;width:19.10%;height:12.60%" aria-label="متعة التعلم"></button>
    <button class="hs" data-go="fgrid" style="left:73.33%;top:3.90%;width:6.97%;height:11.72%" aria-label="اشترك"></button>
    <button class="hs" data-go="grid" style="left:81.41%;top:3.90%;width:7.16%;height:11.72%" aria-label="المحتوى"></button>
    <button class="hs" data-go="home" style="left:89.68%;top:3.90%;width:7.06%;height:11.72%" aria-label="الرئيسية"></button>

    <button class="hs round soft" id="btn-say-big" style="left:28.44%;top:18.83%;width:42.94%;height:64.44%" aria-label="استمع للحرف"></button>
    <button class="hs round" id="btn-say" style="left:43.31%;top:75.03%;width:11.62%;height:17.15%" aria-label="استمع للحرف"></button>
    <button class="hs round" data-go="grid" style="left:6.97%;top:60.81%;width:6.69%;height:10.04%" aria-label="رجوع"></button>

    <button class="arrow-nav prev" data-step="-1" data-set="alphabet" aria-label="الحرف السابق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow-nav next" data-step="1" data-set="alphabet" aria-label="الحرف التالي"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </section>

  <!-- ======================= GRILLE — LETTRES AVEC FATHA ======================= -->
  <section class="screen" id="screen-fgrid">
    <img class="bg" src="assets/fatha/grid.jpg" alt="الحروف مع الفتحة — حروف الأبجدية العربية">

    <button class="hs" data-go="home"  style="left:1.40%;top:1.10%;width:21.50%;height:14.20%" aria-label="متعة التعلم"></button>
    <button class="hs" data-go="fgrid" style="left:84.40%;top:1.20%;width:6.90%;height:12.70%" aria-label="المحتوى"></button>
    <button class="hs" data-go="home"  style="left:91.40%;top:1.20%;width:6.90%;height:12.70%" aria-label="الرئيسية"></button>

    <div class="tiles" id="tiles-fgrid"></div>
  </section>

  <!-- ======================= LETTRE — AVEC FATHA ======================= -->
  <section class="screen" id="screen-fletter">
    <img class="bg" id="fletter-bg" src="assets/fatha/alef.jpg" alt="">

    <button class="hs" data-go="fgrid" style="left:80.80%;top:0.80%;width:8.40%;height:13.80%" aria-label="المحتوى"></button>
    <button class="hs" data-go="home"  style="left:89.20%;top:0.80%;width:9.60%;height:13.80%" aria-label="الرئيسية"></button>

    <button class="hs round soft" id="btn-fsay-big" style="left:55.20%;top:22.00%;width:28.60%;height:54.50%" aria-label="استمع للحرف"></button>
    <button class="hs round" id="btn-fsay" style="left:64.40%;top:78.20%;width:10.40%;height:15.20%" aria-label="استمع للحرف"></button>

    <button class="arrow-nav back" data-go="fgrid" aria-label="رجوع إلى قائمة الحروف"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z" fill="currentColor"/></svg></button>

    <button class="arrow-nav prev" data-step="-1" data-set="fatha" aria-label="الحرف السابق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="arrow-nav next" data-step="1" data-set="fatha" aria-label="الحرف التالي"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </section>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
